# Gera o SVG da cobrinha a partir do grafico de contribuicoes.
#
# O resultado nao e gerado a cada visita ao perfil: este workflow roda
# na agenda abaixo, grava o SVG na branch "output" e o README aponta
# para la. Entre duas execucoes, a imagem fica congelada.
#
# Arquivo: .github/workflows/snake.yml

name: Gerar animacao de contribuicoes

on:
  # A cada 12 horas. Diminuir muito esse intervalo gasta minutos de
  # Actions sem ganho visivel -- o grafico muda pouco ao longo do dia.
  schedule:
    - cron: "0 */12 * * *"

  # Permite disparar na mao pela aba Actions, util no primeiro teste.
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  gerar:
    runs-on: ubuntu-latest

    # Menor privilegio: o job so precisa escrever na branch output.
    permissions:
      contents: write

    steps:
      - name: Gerar SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # %23 e o "#" codificado -- dentro de uma URL ele marcaria
          # o inicio de um fragmento e a cor seria perdida.
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%234A9FA8&color_dots=%23161B22,%230F3B42,%231F6F78,%233A96A1,%236FC9D2

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
